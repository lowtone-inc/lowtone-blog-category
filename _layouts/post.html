---
layout: default
---
<article class="post">
  <header class="post__header">
    <h1 class="post__title">{{ page.title | escape }}</h1>
    {% include post-meta.html post=page %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <nav class="post-nav" aria-label="이전/다음 글">
    {%- if page.previous -%}
      <a class="post-nav__link post-nav__link--prev" href="{{ page.previous.url | relative_url }}"><small>이전 글</small>{{ page.previous.title | escape }}</a>
    {%- endif -%}
    {%- if page.next -%}
      <a class="post-nav__link post-nav__link--next" href="{{ page.next.url | relative_url }}"><small>다음 글</small>{{ page.next.title | escape }}</a>
    {%- endif -%}
  </nav>
</article>
