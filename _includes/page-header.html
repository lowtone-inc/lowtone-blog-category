{%- comment -%}
  페이지 상단 제목 영역
  사용법: {% include page-header.html title="제목" description="설명" %}
{%- endcomment -%}
<header class="page-header">
  <h1 class="page-header__title">{{ include.title }}</h1>
  {%- if include.description -%}
    <p class="page-header__desc">{{ include.description }}</p>
  {%- endif -%}
</header>
