{%- comment -%}
  글 목록의 카드 한 장
  사용법: {% include post-card.html post=post %}
{%- endcomment -%}
<article class="post-card">
  <h2 class="post-card__title">
    <a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a>
  </h2>
  {% include post-meta.html post=include.post %}
  <p class="post-card__excerpt">
    {{- include.post.description | default: include.post.excerpt | strip_html | truncate: 140 -}}
  </p>
</article>
