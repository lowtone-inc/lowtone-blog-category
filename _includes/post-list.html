{%- comment -%}
  글 카드 목록 (홈 · 카테고리 페이지 공용)
  사용법: {% include post-list.html posts=paginator.posts %}
{%- endcomment -%}
{%- if include.posts.size > 0 -%}
<div class="post-list">
  {%- for post in include.posts -%}
    {% include post-card.html post=post %}
  {%- endfor -%}
</div>
{%- else -%}
<p class="empty">아직 작성된 글이 없습니다.</p>
{%- endif -%}
